name: FretShift checks
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify-immersive-beta-gate.mjs

  edge:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # Vitest covers password-signup and vision-import (*.test.ts); Deno tests
      # use *_test.ts. Type-check every function's Deno entry point.
      - run: deno check --no-lock supabase/functions/password-signup/index.ts supabase/functions/vision-import/index.ts supabase/functions/youtube-import/index.ts
      - run: deno test --no-lock supabase/functions/youtube-import/ supabase/functions/_shared/

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=chromium-unconfigured
          - browser: webkit
            projects: --project=webkit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test ${{ matrix.projects }}
      - name: Immersive offline check (production build)
        run: pnpm build && node scripts/verify-immersive-offline.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}
          path: test-results
